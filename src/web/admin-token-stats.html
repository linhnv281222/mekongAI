<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Token Usage Statistics — Mekong AI Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0B0E14;
      color: #F8FAFC;
      line-height: 1.6;
      padding: 24px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 32px;
      padding-bottom: 16px;
      border-bottom: 1px solid #1E293B;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      color: #F8FAFC;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #94A3B8;
      font-size: 14px;
    }

    .filters {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      padding: 16px;
      background: #111827;
      border: 1px solid #1E293B;
      border-radius: 8px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-group label {
      font-size: 12px;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    .filter-group input,
    .filter-group select {
      padding: 8px 12px;
      background: #0B0E14;
      border: 1px solid #1E293B;
      border-radius: 6px;
      color: #F8FAFC;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .filter-group input:focus,
    .filter-group select:focus {
      border-color: #38BDF8;
    }

    button {
      padding: 8px 16px;
      background: #38BDF8;
      color: #0B0E14;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      align-self: flex-end;
    }

    button:hover {
      background: #22D3EE;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: #111827;
      border: 1px solid #1E293B;
      border-radius: 8px;
      padding: 20px;
    }

    .stat-label {
      font-size: 12px;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 600;
      color: #F8FAFC;
      font-variant-numeric: tabular-nums;
    }

    .stat-subtext {
      font-size: 13px;
      color: #64748B;
      margin-top: 4px;
    }

    .section {
      background: #111827;
      border: 1px solid #1E293B;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #F8FAFC;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      border-bottom: 1px solid #1E293B;
    }

    th {
      text-align: left;
      padding: 12px 16px;
      font-size: 12px;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid #1E293B;
      font-size: 14px;
      color: #F8FAFC;
      font-variant-numeric: tabular-nums;
    }

    tr:hover {
      background: #0B0E14;
    }

    .model-badge {
      display: inline-block;
      padding: 4px 8px;
      background: #1E293B;
      border-radius: 4px;
      font-size: 11px;
      color: #38BDF8;
      font-family: 'Courier New', monospace;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #64748B;
    }

    .error {
      background: #7F1D1D;
      border: 1px solid #991B1B;
      color: #FCA5A5;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 24px;
    }

    .cost-estimate {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      padding: 8px 12px;
      background: #0B0E14;
      border-radius: 6px;
      font-size: 13px;
    }

    .cost-label {
      color: #94A3B8;
    }

    .cost-value {
      color: #F97316;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 Token Usage Statistics</h1>
      <p class="subtitle">Đo lường token và chi phí xử lý email qua AI</p>
    </header>

    <div class="filters">
      <div class="filter-group">
        <label>Start Date</label>
        <input type="date" id="startDate" />
      </div>
      <div class="filter-group">
        <label>End Date</label>
        <input type="date" id="endDate" />
      </div>
      <div class="filter-group">
        <label>Model Filter</label>
        <select id="modelFilter">
          <option value="">All Models</option>
          <option value="xiaomi">Xiaomi</option>
          <option value="gemini">Gemini</option>
          <option value="claude">Claude</option>
        </select>
      </div>
      <button onclick="loadStats()">Apply Filters</button>
    </div>

    <div id="error"></div>

    <div id="loading" class="loading" style="display: none;">
      Loading statistics...
    </div>

    <div id="stats" style="display: none;">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Total Jobs</div>
          <div class="stat-value" id="totalJobs">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Tokens</div>
          <div class="stat-value" id="totalTokens">—</div>
          <div class="stat-subtext">
            <span id="classifyTokens">—</span> classify + <span id="drawingTokens">—</span> drawing
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Avg Tokens/Job</div>
          <div class="stat-value" id="avgTokens">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Estimated Cost</div>
          <div class="stat-value" id="estimatedCost">—</div>
          <div class="stat-subtext" id="costBreakdown">—</div>
        </div>
      </div>

      <div class="section">
        <h2 class="section-title">Daily Breakdown</h2>
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Jobs</th>
              <th>Classify Tokens</th>
              <th>Drawing Tokens</th>
              <th>Total Tokens</th>
              <th>Model</th>
            </tr>
          </thead>
          <tbody id="dailyTable">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;

    // Pricing per 1M tokens (estimated)
    const PRICING = {
      'xiaomi': { input: 0.1, output: 0.1 }, // $0.1/1M tokens (estimated)
      'gemini': { input: 0.075, output: 0.15 }, // Gemini 2.5 Flash
      'claude': { input: 3, output: 15 }, // Claude Sonnet 4
    };

    function formatNumber(num) {
      return new Intl.NumberFormat('en-US').format(num || 0);
    }

    function formatCost(usd) {
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        minimumFractionDigits: 4,
      }).format(usd || 0);
    }

    function estimateCost(tokens, model) {
      // Assume 50/50 input/output split for simplicity
      const modelKey = Object.keys(PRICING).find(k => model?.includes(k));
      if (!modelKey) return 0;

      const pricing = PRICING[modelKey];
      const inputTokens = tokens * 0.5;
      const outputTokens = tokens * 0.5;

      return (inputTokens / 1000000 * pricing.input) + (outputTokens / 1000000 * pricing.output);
    }

    async function loadStats() {
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      const model = document.getElementById('modelFilter').value;

      const params = new URLSearchParams();
      if (startDate) params.set('start', startDate);
      if (endDate) params.set('end', endDate);
      if (model) params.set('model', model);

      document.getElementById('loading').style.display = 'block';
      document.getElementById('stats').style.display = 'none';
      document.getElementById('error').innerHTML = '';

      try {
        const response = await fetch(`${API_BASE}/api/token-stats?${params}`);
        const data = await response.json();

        if (!data.success) {
          throw new Error(data.error || 'Failed to load statistics');
        }

        displayStats(data);
      } catch (error) {
        document.getElementById('error').innerHTML = `
          <div class="error">
            <strong>Error:</strong> ${error.message}
          </div>
        `;
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    function displayStats(data) {
      const { totals, daily } = data;

      document.getElementById('totalJobs').textContent = formatNumber(totals.total_jobs);
      document.getElementById('totalTokens').textContent = formatNumber(totals.total_tokens);
      document.getElementById('classifyTokens').textContent = formatNumber(totals.total_classify_tokens);
      document.getElementById('drawingTokens').textContent = formatNumber(totals.total_drawing_tokens);
      document.getElementById('avgTokens').textContent = formatNumber(totals.avg_tokens_per_job);

      // Calculate cost estimate based on models used
      let totalCost = 0;
      daily.forEach(row => {
        const classifyModel = row.classify_model || '';
        const drawingModel = row.drawing_model || '';

        totalCost += estimateCost(row.classify_tokens, classifyModel);
        totalCost += estimateCost(row.drawing_tokens, drawingModel);
      });

      document.getElementById('estimatedCost').textContent = formatCost(totalCost);
      document.getElementById('costBreakdown').textContent =
        `≈ ${formatCost(totalCost / (totals.total_jobs || 1))} per job`;

      // Daily breakdown table
      const dailyTable = document.getElementById('dailyTable');
      dailyTable.innerHTML = daily.map(row => `
        <tr>
          <td>${row.date}</td>
          <td>${formatNumber(row.job_count)}</td>
          <td>${formatNumber(row.classify_tokens)}</td>
          <td>${formatNumber(row.drawing_tokens)}</td>
          <td>${formatNumber(row.total_tokens)}</td>
          <td>
            ${row.classify_model ? `<span class="model-badge">${row.classify_model}</span>` : '—'}
          </td>
        </tr>
      `).join('');

      document.getElementById('stats').style.display = 'block';
    }

    // Set default date range (last 7 days)
    window.addEventListener('DOMContentLoaded', () => {
      const today = new Date();
      const weekAgo = new Date(today);
      weekAgo.setDate(weekAgo.getDate() - 7);

      document.getElementById('endDate').valueAsDate = today;
      document.getElementById('startDate').valueAsDate = weekAgo;

      loadStats();
    });
  </script>
</body>
</html>
